name: Convert RealESRGAN x2 to Core ML

on:
  workflow_dispatch:
  push:
    branches: [testping]
    paths:
      - 'Scripts/convert_esrgan_x2.py'
      - '.github/workflows/convert-esrgan-x2.yml'

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.7.0 torchvision==0.22.0 coremltools==8.0 numpy pillow

      - name: 运行模型转换
        run: |
          cd Scripts
          python convert_esrgan_x2.py

      - name: 验证模型文件
        run: |
          if [ -d "Scripts/real_esrgan_x2.mlpackage" ]; then
            echo "✅ 模型转换成功"
            find Scripts/real_esrgan_x2.mlpackage -type f | head -20
          else
            echo "❌ 模型转换失败"
            exit 1
          fi

      - name: 上传 mlpackage
        uses: actions/upload-artifact@v4
        with:
          name: real_esrgan_x2
          path: Scripts/real_esrgan_x2.mlpackage
          retention-days: 90

      - name: 部署到 Resources 目录
        run: |
          rm -rf FrameInterpolation/Resources/RealESRGAN_x2.mlpackage
          cp -r Scripts/real_esrgan_x2.mlpackage FrameInterpolation/Resources/RealESRGAN_x2.mlpackage
          echo "✅ 模型已复制到 Resources/RealESRGAN_x2.mlpackage"

      - name: 提交并推送模型
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FrameInterpolation/Resources/RealESRGAN_x2.mlpackage
          git diff --staged --quiet || git commit -m "chore: 更新 RealESRGAN_x2.mlpackage 模型文件 [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git testping
