name: Convert RealESRGAN x2 to Core ML

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.7.0 torchvision==0.22.0 coremltools==8.0 numpy pillow

      - name: 运行模型转换
        run: |
          cd Scripts
          python convert_esrgan_x2.py

      - name: 验证模型文件
        run: |
          if [ -d "Scripts/real_esrgan_x2.mlpackage" ]; then
            echo "✅ 模型转换成功"
            find Scripts/real_esrgan_x2.mlpackage -type f | head -20
          else
            echo "❌ 模型转换失败"
            exit 1
          fi

      - name: 上传 mlpackage
        uses: actions/upload-artifact@v4
        with:
          name: real_esrgan_x2
          path: Scripts/real_esrgan_x2.mlpackage
          retention-days: 90
