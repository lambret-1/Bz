name: Convert Fast-SRGAN to Core ML

on:
  workflow_dispatch:
  push:
    branches: [testping]
    paths:
      - 'Scripts/convert_fast_srgan.py'
      - 'Scripts/fast_srgan_model/**'
      - '.github/workflows/convert-fast-srgan.yml'

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.7.0 torchvision==0.22.0 coremltools==8.0 numpy

      - name: 运行模型转换
        run: |
          cd Scripts
          python convert_fast_srgan.py

      - name: 验证模型文件
        run: |
          if [ -d "Scripts/fast_srgan.mlpackage" ]; then
            echo "✅ 模型转换成功"
            find Scripts/fast_srgan.mlpackage -type f | head -20
          else
            echo "❌ 模型转换失败，未找到 fast_srgan.mlpackage"
            exit 1
          fi

      - name: 上传 mlpackage
        uses: actions/upload-artifact@v4
        with:
          name: fast_srgan
          path: Scripts/fast_srgan.mlpackage
          retention-days: 90
