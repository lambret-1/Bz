name: Convert RIFE Lite to Core ML

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision coremltools numpy

      - name: 运行模型转换
        run: |
          cd Scripts
          python convert_rife.py

      - name: 上传 mlpackage
        uses: actions/upload-artifact@v4
        with:
          name: RIFE_Lite
          path: Scripts/RIFE_Lite.mlpackage
          retention-days: 90
