name: iOS Build

on:
  push:
    branches: [main, testping]
    paths-ignore:
      - '**.md'
      - '资料/**'
      - '**.ips'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 缓存 Swift Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 自动递增版本号（补丁位 0-9 自动进位）
        id: version
        run: |
          # 读取当前版本号
          CURRENT_VERSION=$(grep 'CFBundleShortVersionString' project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "基准版本: $CURRENT_VERSION"

          # 解析 X.Y.Z
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # 基于构建次数持续递增（github.run_number 从1开始，每次构建+1）
          TOTAL_PATCH=$((PATCH + ${GITHUB_RUN_NUMBER} - 1))

          # 补丁位 0-9 自动进位
          NEW_PATCH=$((TOTAL_PATCH % 10))
          CARRY=$((TOTAL_PATCH / 10))
          TOTAL_MINOR=$((MINOR + CARRY))
          NEW_MINOR=$((TOTAL_MINOR % 10))
          NEW_MAJOR=$((MAJOR + TOTAL_MINOR / 10))

          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "构建版本: $NEW_VERSION (构建次数: ${GITHUB_RUN_NUMBER})"

          # 动态更新 project.yml 中的版本号（不提交，仅用于本次构建）
          sed -i '' "s/CFBundleShortVersionString: \"${CURRENT_VERSION}\"/CFBundleShortVersionString: \"${NEW_VERSION}\"/" project.yml

          # 同步更新 CFBundleVersion 为构建时间戳（中国时间）
          BUILD_NUMBER=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)
          sed -i '' "s/CFBundleVersion: \"[0-9]*\"/CFBundleVersion: \"${BUILD_NUMBER}\"/" project.yml

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "版本号已更新为: $NEW_VERSION (构建号: $BUILD_NUMBER)"

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 归档（未签名）
        run: |
          xcodebuild archive \
            -project FrameInterpolation.xcodeproj \
            -scheme FrameInterpolation \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FrameInterpolation.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 导出未签名 IPA
        run: |
          BRANCH=${GITHUB_REF_NAME}
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          IPA_NAME="AI补帧_${BRANCH}_v${VERSION}.ipa"
          mkdir -p build/Payload
          cp -r build/FrameInterpolation.xcarchive/Products/Applications/FrameInterpolation.app build/Payload/
          cd build && zip -r "$IPA_NAME" Payload/
          echo "ipa_name=$IPA_NAME" >> $GITHUB_OUTPUT
          echo "产物名称: $IPA_NAME"
          echo "构建时间(中国时间): $BUILD_TIME"
        id: export

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI补帧_${{ github.ref_name }}_v${{ steps.version.outputs.version }}
          path: build/${{ steps.export.outputs.ipa_name }}
          retention-days: 30
