name: iOS Build

on:
  push:
    branches: [main, testping, test]
    paths-ignore:
      - '**.md'
      - '资料/**'
      - '**.ips'
      - '**.txt'
      - 'crash_logs/**'
      - 'parse_ips.py'
      - 'Scripts/**'
      - '.github/workflows/analyze-ips.yml'
      - '.github/workflows/convert-*.yml'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 缓存 Swift Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 自动递增版本号（补丁位 0-9 自动进位）
        id: version
        run: |
          # 读取当前版本号
          CURRENT_VERSION=$(grep 'CFBundleShortVersionString' project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "当前版本: $CURRENT_VERSION"

          # 解析 X.Y.Z
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # 补丁位递增，0-9 自动进位
          PATCH=$((PATCH + 1))
          if [ "$PATCH" -gt 9 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
            if [ "$MINOR" -gt 9 ]; then
              MINOR=0
              MAJOR=$((MAJOR + 1))
            fi
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "新版本: $NEW_VERSION"

          # 更新 project.yml 中的版本号
          sed -i '' "s/CFBundleShortVersionString: \"${CURRENT_VERSION}\"/CFBundleShortVersionString: \"${NEW_VERSION}\"/" project.yml

          # 同步更新 CFBundleVersion 为中国时间构建号
          BUILD_NUMBER=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)
          sed -i '' "s/CFBundleVersion: \"[0-9]*\"/CFBundleVersion: \"${BUILD_NUMBER}\"/" project.yml

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "版本号: $NEW_VERSION (构建号: $BUILD_NUMBER)"

          # 提交版本号更新（跳过 CI 避免无限循环）
          git add project.yml
          git commit -m "chore: 自动递增版本号至 v${NEW_VERSION} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME} || echo "警告: 版本号提交失败（权限不足），仅本次构建使用新版本号"

      - name: 下载 RealESRGAN_x4 模型文件
        run: |
          mkdir -p FrameInterpolation/Resources/RealESRGAN_x4.mlpackage/Data/com.apple.CoreML
          curl -L -o FrameInterpolation/Resources/RealESRGAN_x4.mlpackage/Data/com.apple.CoreML/model.mlmodel \
            "https://github.com/lambret-1/Bz/releases/download/model-realesrgan-x2/model.mlmodel"
          echo "模型大小: $(du -h FrameInterpolation/Resources/RealESRGAN_x4.mlpackage/Data/com.apple.CoreML/model.mlmodel | cut -f1)"

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 归档（未签名）
        run: |
          xcodebuild archive \
            -project FrameInterpolation.xcodeproj \
            -scheme FrameInterpolation \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FrameInterpolation.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 导出未签名 IPA
        run: |
          BRANCH=${GITHUB_REF_NAME}
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          IPA_NAME="AI补帧_${BRANCH}_v${VERSION}.ipa"
          mkdir -p build/Payload
          cp -r build/FrameInterpolation.xcarchive/Products/Applications/FrameInterpolation.app build/Payload/
          cd build && zip -r "$IPA_NAME" Payload/
          echo "ipa_name=$IPA_NAME" >> $GITHUB_OUTPUT
          echo "产物名称: $IPA_NAME"
          echo "构建时间(中国时间): $BUILD_TIME"
        id: export

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI补帧_${{ github.ref_name }}_v${{ steps.version.outputs.version }}
          path: build/${{ steps.export.outputs.ipa_name }}
          retention-days: 30

      - name: 打包 dSYM
        run: |
          cd build/FrameInterpolation.xcarchive/dSYMs
          zip -r "../../dSYM_v${{ steps.version.outputs.version }}_${{ steps.version.outputs.build_number }}.zip" .
          echo "dSYM 打包完成: dSYM_v${{ steps.version.outputs.version }}_${{ steps.version.outputs.build_number }}.zip"

      - name: 上传 dSYM
        uses: actions/upload-artifact@v4
        with:
          name: dSYM_v${{ steps.version.outputs.version }}_${{ steps.version.outputs.build_number }}
          path: build/dSYM_v${{ steps.version.outputs.version }}_${{ steps.version.outputs.build_number }}.zip
          retention-days: 90
