name: iOS Build

on:
  push:
    branches: [main, testping]
    paths-ignore:
      - '**.md'
      - '资料/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 缓存 Swift Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep 'CFBundleShortVersionString' project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本号: $VERSION"

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 归档（未签名）
        run: |
          xcodebuild archive \
            -project FrameInterpolation.xcodeproj \
            -scheme FrameInterpolation \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FrameInterpolation.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 导出未签名 IPA
        run: |
          BRANCH=${GITHUB_REF_NAME}
          VERSION=${{ steps.version.outputs.version }}
          IPA_NAME="AI补帧_${BRANCH}_v${VERSION}.ipa"
          mkdir -p build/Payload
          cp -r build/FrameInterpolation.xcarchive/Products/Applications/FrameInterpolation.app build/Payload/
          cd build && zip -r "$IPA_NAME" Payload/
          echo "ipa_name=$IPA_NAME" >> $GITHUB_OUTPUT
          echo "产物名称: $IPA_NAME"
        id: export

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI补帧_${{ github.ref_name }}_v${{ steps.version.outputs.version }}
          path: build/${{ steps.export.outputs.ipa_name }}
          retention-days: 30
