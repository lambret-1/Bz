name: Convert Model

on:
  workflow_dispatch:
  push:
    branches: [test]
    paths:
      - 'Scripts/convert_x4plus.py'
      - '.github/workflows/convert-esrgan.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: 设置 Git 身份
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 必须装 basicsr-fixed
          pip install torch==2.7.0 torchvision==0.22.0 coremltools==8.0 numpy Pillow basicsr-fixed

      - name: 运行转换
        run: |
          cd Scripts
          python convert_x4plus.py

      - name: 验证
        run: |
          if [ ! -d "Scripts/real_esrgan_x4v3.mlpackage" ]; then
            echo "❌ 模型转换失败"
            exit 1
          fi
          echo "✅模型生成成功"

      - name: 自动推送到资源目录
        run: |
          git lfs install
          git lfs track "*.mlpackage/**/*"
          git add .gitattributes

          # 删旧的，换新的
          rm -rf FrameInterpolation/Resources/real_esrgan_x4v3.mlpackage
          mv Scripts/real_esrgan_x4v3.mlpackage FrameInterpolation/Resources/

          git add FrameInterpolation/Resources/real_esrgan_x4v3.mlpackage
          
          if git diff-index --quiet HEAD; then
            echo "⚠️ 模型无变化，跳过提交"
          else
            git commit -m "chore: 自动更新 x4plus 模型 (伪装v3) [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi